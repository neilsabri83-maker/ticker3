<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Actions en temps réel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background-color: #0e1117;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .ticker-container {
      width: 100%;
      max-width: 1200px;
    }
  </style>
</head>

<body>

<div class="ticker-container">
  <div class="tradingview-widget-container">
    <script
      type="text/javascript"
      src="https://s3.tradingview.com/external-embedding/embed-ticker-tape.js"
      async>
    {
      "symbols": [
        { "proName": "NYSE:PLTR", "title": "Palantir" },
        { "proName": "NYSE:XOM", "title": "Exxon" },
        { "proName": "NASDAQ:TSLA", "title": "Tesla" },
        { "proName": "NASDAQ:NVDA", "title": "Nvidia" },
        { "proName": "NYSE:CVX", "title": "Chevron" }
      ],
      "showSymbolLogo": true,
      "isTransparent": false,
      "displayMode": "adaptive",
      "colorTheme": "dark",
      "locale": "fr"
    }
    </script>
  </div>
</div>

</body>
</html>
