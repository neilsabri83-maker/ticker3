<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard TradingView</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0e1117;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    h1 {
      margin: 20px 0 10px;
    }

    select {
      width: 90%;
      max-width: 400px;
      padding: 12px;
      font-size: 18px;
      background-color: #161b22;
      color: white;
      border: 1px solid #30363d;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    #chart-container {
      width: 95%;
      max-width: 1200px;
      height: 600px;
    }
  </style>
</head>

<body>

  <h1>📈 Surveillance Actions</h1>

  <select id="symbolSelect" onchange="loadChart()">
    <option value="NYSE:PLTR">Palantir</option>
    <option value="NYSE:XOM">Exxon</option>
    <option value="NASDAQ:TSLA">Tesla</option>
    <option value="NASDAQ:NVDA">Nvidia</option>
    <option value="NYSE:CVX">Chevron</option>
  </select>

  <div id="chart-container"></div>

  <script>
    function loadChart() {
      const symbol = document.getElementById("symbolSelect").value;
      const container = document.getElementById("chart-container");

      container.innerHTML = `
        <div class="tradingview-widget-container">
          <div id="tradingview_chart"></div>
          <script type="text/javascript" src="https://s3.tradingview.com/tv.js"><\/script>
          <script type="text/javascript">
            new TradingView.widget({
              "width": "100%",
              "height": "600",
              "symbol": "${symbol}",
              "interval": "D",
              "timezone": "Europe/Paris",
              "theme": "dark",
              "style": "1",
              "locale": "fr",
              "toolbar_bg": "#0e1117",
              "enable_publishing": false,
              "hide_top_toolbar": false,
              "hide_side_toolbar": false,
              "allow_symbol_change": false,
              "studies": [],
              "container_id": "tradingview_chart"
            });
          <\/script>
        </div>
      `;
    }

    // Chargement initial
    loadChart();
  </script>

</body>
</html>
